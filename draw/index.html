<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Wiggle Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Andika:wght@400;700&display=swap">
<style>
/* Layout: a toy on a craft table — the stage (a picture frame) on top, chunky crayon-coloured buttons below. One committed bright look. */
:root {
  --table: #f4e3c3;     /* the craft table */
  --paper: #fffaf0;
  --ink: #2a2a35;
  --tomato: #ef5a3c;
  --sun: #ffc531;
  --sky: #3aa0e8;
  --grass: #4cb050;
  --plum: #8a4fc8;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--table) repeating-linear-gradient(90deg, rgba(160,110,60,.06) 0 2px, transparent 2px 46px);
  color: var(--ink); font-family: var(--body);
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 5vw, 44px); margin: 0; line-height: 1; letter-spacing: .01em; }
h1 span:nth-child(1) { color: var(--tomato); } h1 span:nth-child(2) { color: var(--sky); } h1 span:nth-child(3) { color: var(--grass); }
.frame { background: #fff; border: 4px solid var(--ink); border-radius: 18px; overflow: hidden; box-shadow: 6px 6px 0 var(--ink); position: relative; }
canvas#stage { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; touch-action: none; cursor: grab; }
.hint { position: absolute; left: 12px; bottom: 10px; right: 12px; font: 700 15px var(--body); color: var(--ink); background: rgba(255,250,240,.88); border-radius: 10px; padding: 6px 10px; width: fit-content; max-width: calc(100% - 24px); pointer-events: none; }
.rec { position: absolute; top: 12px; right: 12px; background: var(--tomato); color: #fff; font: 700 16px var(--body); padding: 6px 12px; border-radius: 999px; }
.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.label { font: 700 13px var(--body); text-transform: uppercase; letter-spacing: .1em; color: #6b6458; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
.effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
button, .filebtn {
  font: 700 18px var(--body); color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 14px;
  padding: 10px 14px; min-height: 52px; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); touch-action: manipulation;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .06s, box-shadow .06s;
}
button:active, .filebtn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible, .filebtn:focus-within { outline: 4px solid var(--sky); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--sun); }
.effects button { background: var(--c, #fff); }
.effects button[aria-pressed="true"] { outline: 4px solid var(--ink); outline-offset: -8px; }
.big { font-family: var(--display); font-weight: 400; font-size: 24px; background: var(--tomato); color: #fff; padding: 12px 22px; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.small { font-size: 16px; min-height: 44px; padding: 8px 12px; }
.top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* the cut-out step */
dialog { border: 4px solid var(--ink); border-radius: 18px; padding: 16px; background: var(--paper); max-width: min(720px, calc(100vw - 32px)); width: 100%; box-shadow: 6px 6px 0 var(--ink); }
dialog::backdrop { background: rgba(42,42,53,.55); }
dialog h2 { font-family: var(--display); font-weight: 400; margin: 0 0 8px; font-size: 28px; }
.check { background: repeating-conic-gradient(#e6e0d4 0 25%, #fff 0 50%) 0 0 / 24px 24px; border-radius: 12px; border: 3px solid var(--ink); display: grid; place-items: center; min-height: 220px; max-height: 50vh; overflow: hidden; }
.check canvas { max-width: 100%; max-height: 48vh; display: block; }
.slider { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font: 700 16px var(--body); margin: 12px 0; }
.slider input { width: 100%; accent-color: var(--tomato); height: 32px; }
.result video { width: 100%; border-radius: 12px; border: 3px solid var(--ink); background: #000; }
@media (max-width: 560px) { .effects { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } button { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>The</span> <span>Wiggle</span> <span>Machine</span></h1>
    <div class="top">
      <label class="filebtn big" for="file">Add a drawing<input id="file" type="file" accept="image/*"></label>
      <button id="sound" class="small" aria-pressed="true" type="button">Sound on</button>
    </div>
  </header>

  <div class="frame">
    <canvas id="stage" width="1280" height="720" aria-label="Your drawings, animated"></canvas>
    <div class="hint" id="hint">Take a photo of a drawing, or choose one from your pictures. Drag your drawings around, and tap them to make them jump.</div>
    <div class="rec" id="recBadge" hidden>Recording…</div>
  </div>

  <section class="panel" aria-label="What should they do?">
    <p class="label">What should they do?</p>
    <div class="effects" id="effects"></div>
  </section>

  <section class="panel">
    <p class="label">Where are they?</p>
    <div class="row" id="scenes"></div>
    <p class="label">Extras</p>
    <div class="row">
      <button id="eyes" type="button" aria-pressed="false">Googly eyes</button>
      <button id="record" type="button">Make a video</button>
      <button id="remove" type="button">Take one away</button>
    </div>
  </section>
</div>

<dialog id="cut">
  <h2>Cutting it out</h2>
  <div class="check"><canvas id="preview"></canvas></div>
  <div class="slider"><span>Rub out less</span><input id="tol" type="range" min="0.06" max="0.4" step="0.01" value="0.17" aria-label="How much paper to rub out"><span>Rub out more</span></div>
  <div class="row">
    <button id="rotate" type="button">Turn it</button>
    <button id="keepPaper" type="button" aria-pressed="false">Keep the paper</button>
    <button id="cancelCut" type="button">Cancel</button>
    <button id="useIt" class="big" type="button">Use it!</button>
  </div>
</dialog>

<dialog id="result">
  <h2>Your video</h2>
  <div class="result"><video id="vid" controls playsinline loop></video></div>
  <div class="row" style="margin-top:12px">
    <button id="saveVid" class="big" type="button">Save it</button>
    <button id="closeVid" type="button">Close</button>
  </div>
  <p class="label" id="saveNote" style="margin-top:10px"></p>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("stage"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
let canFilter = "filter" in ctx;

// ------------------------------------------------------------------ sound
let actx = null, master = null, recDest = null, soundOn = true;
function audio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
      if (actx.createMediaStreamDestination) { recDest = actx.createMediaStreamDestination(); master.connect(recDest); }
    } catch (e) { return null; }
  }
  if (actx.state === "suspended") actx.resume();
  return soundOn ? actx : null;
}
function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, f0, f1, vol = 0.25) {
  const a = audio(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  f.type = "bandpass"; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.buffer = b; s.connect(f).connect(g).connect(master); s.start(t);
}
const SFX = {
  boing: () => { tone("sine", 180, 620, 0.18, 0.35); tone("sine", 620, 260, 0.25, 0.25, 0.16); },
  pop: () => { tone("square", 900, 120, 0.12, 0.15); noise(0.25, 2000, 300, 0.3); },
  whoosh: () => noise(1.2, 300, 3000, 0.35),
  wobble: () => { for (let k = 0; k < 4; k++) tone("sine", 300 + k * 40, 200, 0.15, 0.2, k * 0.12); },
  sparkle: () => { [1047, 1319, 1568, 2093].forEach((f, k) => tone("triangle", f, f, 0.3, 0.12, k * 0.07)); },
  stomp: () => { tone("sine", 90, 40, 0.4, 0.5); noise(0.3, 200, 80, 0.3); },
  slide: () => tone("sawtooth", 700, 120, 0.8, 0.08),
  blip: () => tone("triangle", 660, 880, 0.08, 0.15),
};
$("sound").onclick = () => { soundOn = !soundOn; $("sound").setAttribute("aria-pressed", String(soundOn)); $("sound").textContent = soundOn ? "Sound on" : "Sound off"; if (soundOn) SFX.blip(); };

// ------------------------------------------------------------------ cutting the drawing out of the paper
// 1. even out the lighting: estimate the paper's colour across the photo from the brightest pixels in each patch
// 2. mark as ink anything darker or more colourful than the paper there
// 3. rub out paper that is connected to the edge (paper enclosed by lines, like the white of an eye, stays)
// 4. remove specks, whiten the remaining paper, crop, and add a white sticker border
let source = null, rotation = 0;
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    im.onerror = rej; im.src = url;
  });
}
function toCanvas(img, maxDim, rot) {
  const s = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * s), h = Math.round(img.height * s);
  const c = document.createElement("canvas"), r = rot % 4;
  c.width = r % 2 ? h : w; c.height = r % 2 ? w : h;
  const g = c.getContext("2d");
  g.translate(c.width / 2, c.height / 2); g.rotate(r * Math.PI / 2); g.drawImage(img, -w / 2, -h / 2, w, h);
  return c;
}
function cutOut(img, tol, keepPaper) {
  const c = toCanvas(img, 900, rotation), w = c.width, h = c.height, g = c.getContext("2d", { willReadFrequently: true });
  const id = g.getImageData(0, 0, w, h), d = id.data, N = w * h;
  // paper estimate per cell
  const S = Math.max(8, Math.round(Math.max(w, h) / 28)), gw = Math.ceil(w / S), gh = Math.ceil(h / S);
  const bg = new Float32Array(gw * gh * 3);
  for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) {
    const lums = [];
    for (let y = cy * S; y < Math.min(h, cy * S + S); y += 2) for (let x = cx * S; x < Math.min(w, cx * S + S); x += 2) {
      const i = (y * w + x) * 4; lums.push([d[i] + d[i + 1] + d[i + 2], i]);
    }
    lums.sort((a, b) => b[0] - a[0]);
    const top = lums.slice(Math.floor(lums.length * 0.03), Math.max(2, Math.floor(lums.length * 0.25)));
    let r = 0, gg = 0, b = 0; for (const [, i] of top) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
    const k = (cy * gw + cx) * 3; bg[k] = r / top.length; bg[k + 1] = gg / top.length; bg[k + 2] = b / top.length;
  }
  // trust a patch as paper only if its brightest pixels look like paper (pale and nearly grey, like the edges);
  // patches full of crayon get their paper colour from their neighbours instead
  const lumOf = (k) => (bg[k] + bg[k + 1] + bg[k + 2]) / 3, chromaOf = (k) => Math.max(bg[k], bg[k + 1], bg[k + 2]) - Math.min(bg[k], bg[k + 1], bg[k + 2]);
  const edge = [];
  for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) if (cx === 0 || cy === 0 || cx === gw - 1 || cy === gh - 1) edge.push(lumOf((cy * gw + cx) * 3));
  edge.sort((a, b) => a - b);
  const paperLum = edge[Math.floor(edge.length / 2)];
  const known = new Uint8Array(gw * gh);
  for (let q = 0; q < gw * gh; q++) known[q] = lumOf(q * 3) > paperLum * 0.72 && chromaOf(q * 3) < Math.max(28, paperLum * 0.14) ? 1 : 0;
  if (!known.some((x) => x)) known.fill(1);
  for (let pass = 0; pass < gw + gh; pass++) {
    let changed = false;
    const next = known.slice();
    for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) {
      const q = cy * gw + cx; if (known[q]) continue;
      let r = 0, gg = 0, b = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= gw || y >= gh) continue;
        const o = y * gw + x; if (!known[o]) continue; r += bg[o * 3]; gg += bg[o * 3 + 1]; b += bg[o * 3 + 2]; n++;
      }
      if (n) { bg[q * 3] = r / n; bg[q * 3 + 1] = gg / n; bg[q * 3 + 2] = b / n; next[q] = 1; changed = true; }
    }
    known.set(next); if (!changed) break;
  }
  // smooth the paper map
  const bg2 = new Float32Array(bg.length);
  for (let cy = 0; cy < gh; cy++) for (let cx = 0; cx < gw; cx++) for (let ch = 0; ch < 3; ch++) {
    let sum = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = clamp(cx + dx, 0, gw - 1), y = clamp(cy + dy, 0, gh - 1); sum += bg[(y * gw + x) * 3 + ch];
    }
    bg2[(cy * gw + cx) * 3 + ch] = sum / 9;
  }
  const ink = new Uint8Array(N), out = new Uint8ClampedArray(d.length);
  for (let y = 0; y < h; y++) {
    const fy = clamp(y / S - 0.5, 0, gh - 1), y0 = Math.floor(fy), y1 = Math.min(gh - 1, y0 + 1), ty = fy - y0;
    for (let x = 0; x < w; x++) {
      const fx = clamp(x / S - 0.5, 0, gw - 1), x0 = Math.floor(fx), x1 = Math.min(gw - 1, x0 + 1), tx = fx - x0;
      const i = (y * w + x) * 4, p = [];
      for (let ch = 0; ch < 3; ch++) {
        const a = bg2[(y0 * gw + x0) * 3 + ch] * (1 - tx) + bg2[(y0 * gw + x1) * 3 + ch] * tx;
        const b = bg2[(y1 * gw + x0) * 3 + ch] * (1 - tx) + bg2[(y1 * gw + x1) * 3 + ch] * tx;
        p.push(Math.max(30, a * (1 - ty) + b * ty));
      }
      const r = d[i] / p[0], gg = d[i + 1] / p[1], b = d[i + 2] / p[2];        // 1 = paper
      const lum = (r + gg + b) / 3, chroma = Math.max(r, gg, b) - Math.min(r, gg, b);
      const inkness = Math.max(1 - lum, chroma * 1.1);
      ink[y * w + x] = inkness > tol ? 1 : 0;
      out[i] = clamp(r * 255, 0, 255); out[i + 1] = clamp(gg * 255, 0, 255); out[i + 2] = clamp(b * 255, 0, 255); out[i + 3] = 255;
    }
  }
  let mask = new Uint8Array(N).fill(1);
  if (!keepPaper) {
    // flood the paper from the edges
    const outside = new Uint8Array(N), stack = new Int32Array(N); let sp = 0;
    const push = (k) => { if (!outside[k] && !ink[k]) { outside[k] = 1; stack[sp++] = k; } };
    for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
    for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
    while (sp) {
      const k = stack[--sp], x = k % w, y = (k / w) | 0;
      if (x > 0) push(k - 1); if (x < w - 1) push(k + 1); if (y > 0) push(k - w); if (y < h - 1) push(k + w);
    }
    for (let k = 0; k < N; k++) mask[k] = outside[k] ? 0 : 1;
    // remove specks smaller than 0.15% of the picture
    const lab = new Int32Array(N), minSize = Math.max(30, N * 0.0015); let next = 1;
    for (let k0 = 0; k0 < N; k0++) {
      if (!mask[k0] || lab[k0]) continue;
      const comp = []; sp = 0; stack[sp++] = k0; lab[k0] = next;
      while (sp) {
        const k = stack[--sp], x = k % w, y = (k / w) | 0; comp.push(k);
        const nb = [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1, y > 0 ? k - w : -1, y < h - 1 ? k + w : -1];
        for (const q of nb) if (q >= 0 && mask[q] && !lab[q]) { lab[q] = next; stack[sp++] = q; }
      }
      if (comp.length < minSize) for (const k of comp) mask[k] = 0;
      next++;
    }
    let count = 0; for (let k = 0; k < N; k++) count += mask[k];
    if (count < N * 0.004 || count > N * 0.97) mask.fill(1);               // nothing sensible found: keep it all
  }
  let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (mask[y * w + x]) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  for (let k = 0; k < N; k++) out[k * 4 + 3] = mask[k] ? 255 : 0;
  const full = document.createElement("canvas"); full.width = w; full.height = h;
  full.getContext("2d").putImageData(new ImageData(out, w, h), 0, 0);
  // crop and add a sticker border
  const B = keepPaper ? 0 : Math.round(Math.max(w, h) / 110) + 3, cw = maxX - minX + 1 + 2 * B, ch = maxY - minY + 1 + 2 * B;
  const st = document.createElement("canvas"); st.width = cw; st.height = ch;
  const sg = st.getContext("2d");
  if (B) {
    const sil = document.createElement("canvas"); sil.width = cw; sil.height = ch;
    const lg = sil.getContext("2d"); lg.drawImage(full, -minX + B, -minY + B); lg.globalCompositeOperation = "source-in"; lg.fillStyle = "#fff"; lg.fillRect(0, 0, cw, ch);
    for (let a = 0; a < 16; a++) sg.drawImage(sil, Math.cos(a / 16 * TAU) * B * 0.8, Math.sin(a / 16 * TAU) * B * 0.8);
  }
  sg.drawImage(full, -minX + B, -minY + B);
  return st;
}

// ------------------------------------------------------------------ a demo drawing, so the stage is never empty
function demoDrawing(kind) {
  const c = document.createElement("canvas"); c.width = 600; c.height = 600;
  const g = c.getContext("2d");
  g.fillStyle = "#f7f3ea"; g.fillRect(0, 0, 600, 600);
  g.lineCap = "round"; g.lineJoin = "round";
  const wob = (pts) => { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x + Math.random() * 3, y + Math.random() * 3) : g.moveTo(x, y))); };
  if (kind === 0) {
    // a fluffy monster
    const body = []; for (let a = 0; a <= TAU + 0.01; a += 0.12) body.push([300 + Math.cos(a) * (150 + 14 * Math.sin(a * 9)), 320 + Math.sin(a) * (130 + 14 * Math.sin(a * 9))]);
    g.fillStyle = "#58b7e8"; wob(body); g.fill();
    for (let k = 0; k < 120; k++) { g.strokeStyle = "rgba(40,120,190,.35)"; g.lineWidth = 3; const x = 180 + Math.random() * 240, y = 220 + Math.random() * 200; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 18, y - 10); g.stroke(); }
    g.strokeStyle = "#1d2a44"; g.lineWidth = 7; wob(body); g.stroke();
    g.fillStyle = "#fff"; g.beginPath(); g.ellipse(250, 280, 34, 40, 0, 0, TAU); g.ellipse(350, 280, 34, 40, 0, 0, TAU); g.fill(); g.stroke();
    g.fillStyle = "#1d2a44"; g.beginPath(); g.arc(258, 288, 13, 0, TAU); g.arc(342, 288, 13, 0, TAU); g.fill();
    g.fillStyle = "#e4473a"; wob([[240, 360], [300, 410], [360, 360], [240, 360]]); g.fill(); g.stroke();
    g.fillStyle = "#fff"; g.fillRect(268, 360, 16, 16); g.fillRect(316, 360, 16, 16);
    g.strokeStyle = "#1d2a44"; for (const x of [230, 370]) { wob([[x, 440], [x - 10, 520], [x + 20, 520]]); g.stroke(); }
    g.fillStyle = "#ffc531"; wob([[230, 200], [250, 140], [280, 190], [300, 130], [320, 190], [350, 140], [370, 200], [230, 200]]); g.fill(); g.stroke();
  } else {

  for (const c of creatures) {
    const ef = effectFor(c, t);
    c.x = ef === EFFECTS.walk && c.wx !== null ? c.wx : c.homeX; c.y = c.homeY; c.rot = 0; c.sx = 1; c.sy = 1; c.alpha = 1; c.hue = 0;
    if (ef.pose) ef.pose(c, t, dt);
    if (c.jump > 0) { c.jump = Math.max(0, c.jump - dt * 1.6); const j = Math.sin(c.jump * Math.PI); c.y -= j * 140; c.sy *= 1 + 0.15 * j; c.sx *= 1 - 0.1 * j; }
    // shadow
    const [w, h] = size(c);
    ctx.setTransform(base); ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(c.x, c.homeY + h * 0.48, w * 0.4 * Math.abs(c.sx), 12, 0, 0, TAU); ctx.fill();
    if (ef.draw) ef.draw(c, t); else drawCreature(c, t, ef.warp || null);
    ctx.setTransform(base);
    if (!ef.draw || ef === EFFECTS.explode && (t % 4.2 < 0.5 || t % 4.2 > 3.4)) drawEyes(c, t, ef.warp || null, dt);
    if (c === selected && dragging) { ctx.strokeStyle = "rgba(42,42,53,.5)"; ctx.setLineDash([10, 8]); ctx.lineWidth = 3; ctx.strokeRect(c.x - w / 2, c.y - h / 2, w, h); ctx.setLineDash([]); }
  }
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k]; p.life -= dt; if (p.life <= 0) { particles.splice(k, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; ctx.globalAlpha = p.life / 0.6; ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, 8 * p.life + 3, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ touching the stage: drag, tap to jump, tap to stick eyes on
let dragging = false, down = null;
function stagePoint(ev) { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width * W, (ev.clientY - r.top) / r.height * H]; }
function hit(x, y) {
  for (let i = creatures.length - 1; i >= 0; i--) {
    const c = creatures[i], [w, h] = size(c), sx = Math.abs(c.sx) || 1, sy = Math.abs(c.sy) || 1;
    const cs = Math.cos(-c.rot), sn = Math.sin(-c.rot), lx = ((x - c.x) * cs - (y - c.y) * sn) / sx, ly = ((x - c.x) * sn + (y - c.y) * cs) / sy;
    if (Math.abs(lx) < w / 2 && Math.abs(ly) < h / 2) return [c, (c.sx < 0 ? -lx : lx) / w + 0.5, ly / h + 0.5];
  }
  return null;
}
cv.addEventListener("pointerdown", (ev) => {
  audio();
  const [x, y] = stagePoint(ev), h = hit(x, y);
  down = { x, y, time: performance.now(), h };
  if (h) { selected = h[0]; cv.setPointerCapture(ev.pointerId); cv.style.cursor = "grabbing"; }
});
cv.addEventListener("pointermove", (ev) => {
  if (!down || !down.h) return;
  const [x, y] = stagePoint(ev);
  if (!dragging && Math.hypot(x - down.x, y - down.y) > 10) dragging = true;
  if (dragging) { const c = down.h[0]; c.homeX = clamp(c.homeX + x - down.x, 0, W); c.homeY = clamp(c.homeY + y - down.y, 60, H - 40); c.wx = null; down.x = x; down.y = y; }
});
cv.addEventListener("pointerup", () => {
  if (down && down.h && !dragging) {
    const [c, u, v] = down.h;
    if (eyesMode) addEye(c, clamp(u, 0, 1), clamp(v, 0, 1)); else { c.jump = 1; SFX.boing(); }
  }
  dragging = false; down = null; cv.style.cursor = "grab";
});

// ------------------------------------------------------------------ buttons
const effBox = $("effects");
for (const [k, e] of Object.entries(EFFECTS)) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = e.label; b.style.setProperty("--c", e.c); b.dataset.k = k;
  b.setAttribute("aria-pressed", String(k === effect));
  b.onclick = () => { effect = k; t0 = performance.now(); lastT = 0; for (const c of creatures) { c.wx = null; c.bits = null; c.mine = null; } effBox.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); (SFX[e.sfx] || SFX.blip)(); };
  effBox.append(b);
}
const sceneBox = $("scenes");
for (const [k, s] of Object.entries(SCENES)) {
  const b = document.createElement("button"); b.type = "button"; b.className = "small"; b.textContent = s.label; b.setAttribute("aria-pressed", String(k === scene));
  b.onclick = () => { scene = k; sceneBox.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); SFX.blip(); };
  sceneBox.append(b);
}
$("eyes").onclick = () => {
  eyesMode = !eyesMode; $("eyes").setAttribute("aria-pressed", String(eyesMode));
  $("hint").textContent = eyesMode ? "Tap on a drawing to stick on a googly eye. Tap Googly eyes again when you have finished." : "Drag your drawings around, and tap them to make them jump.";
};
$("remove").onclick = () => {
  if (!creatures.length) return;
  const c = selected && creatures.includes(selected) ? selected : creatures[creatures.length - 1];
  creatures.splice(creatures.indexOf(c), 1); selected = null; layout(); SFX.pop();
};

// adding a drawing
let cutResult = null;
function refreshCut() {
  if (!source) return;
  cutResult = cutOut(source, +$("tol").value, $("keepPaper").getAttribute("aria-pressed") === "true");
  const p = $("preview"); p.width = cutResult.width; p.height = cutResult.height; p.getContext("2d").drawImage(cutResult, 0, 0);
}
let cutTimer = null;
$("tol").oninput = () => { clearTimeout(cutTimer); cutTimer = setTimeout(refreshCut, 120); };
$("rotate").onclick = () => { rotation = (rotation + 1) % 4; refreshCut(); };
$("keepPaper").onclick = () => { const b = $("keepPaper"); b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true")); refreshCut(); };
$("cancelCut").onclick = () => $("cut").close();
$("useIt").onclick = () => { if (cutResult) { const c = addCreature(cutResult); c.jump = 1; SFX.sparkle(); } $("cut").close(); $("hint").textContent = "Drag your drawings around, and tap them to make them jump."; };
$("file").onchange = async (ev) => {
  const f = ev.target.files && ev.target.files[0]; ev.target.value = "";
  if (!f) return;
  try { source = await loadImage(f); } catch (e) { $("hint").textContent = "That picture wouldn't open. Try a photo (JPEG or PNG)."; return; }
  rotation = 0; $("keepPaper").setAttribute("aria-pressed", "false");
  $("cut").showModal(); setTimeout(refreshCut, 30);
};

// recording a video of the stage
let recorder = null, lastBlob = null;
$("record").onclick = () => {
  if (recorder) return;
  if (!cv.captureStream || !window.MediaRecorder) { $("hint").textContent = "This browser can't make videos, sorry. Try Safari on the iPad, or Chrome."; return; }
  audio();
  const stream = cv.captureStream(30);
  if (recDest) recDest.stream.getAudioTracks().forEach((tr) => stream.addTrack(tr));
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
  const type = types.find((x) => MediaRecorder.isTypeSupported(x)) || "";
  const chunks = [];
  try { recorder = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 4e6 } : undefined); } catch (e) { recorder = null; $("hint").textContent = "Couldn't start the video, sorry."; return; }
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    $("recBadge").hidden = true; $("record").disabled = false;
    lastBlob = new Blob(chunks, { type: recorder.mimeType || type || "video/webm" }); recorder = null;
    $("vid").src = URL.createObjectURL(lastBlob); $("saveNote").textContent = "";
    $("result").showModal(); $("vid").play().catch(() => {});
  };
  $("recBadge").hidden = false; $("record").disabled = true;
  let n = 6; $("recBadge").textContent = "Recording… " + n;
  const tick = setInterval(() => { n--; $("recBadge").textContent = "Recording… " + n; if (n <= 0) { clearInterval(tick); recorder.stop(); } }, 1000);
  recorder.start(250);
};
$("closeVid").onclick = () => $("result").close();
$("saveVid").onclick = async () => {
  if (!lastBlob) return;
  const ext = lastBlob.type.includes("mp4") ? "mp4" : "webm", name = "wiggle-machine." + ext;
  const file = new File([lastBlob], name, { type: lastBlob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "The Wiggle Machine" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastBlob); a.download = name; document.body.append(a); a.click(); a.remove();
  $("saveNote").textContent = "Saved to your Downloads.";
};

// start with two demo drawings, run through the same cutting-out as a real photo
source = demoDrawing(0); addCreature(cutOut(source, 0.17, false));
source = demoDrawing(1); addCreature(cutOut(source, 0.17, false));
source = null;
requestAnimationFrame(frame);
</script>
