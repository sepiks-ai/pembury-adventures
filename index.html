<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Swords of Pembury</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
<style>
/* Layout: a storybook spread — the picture (the scene) above, the page of text and the twins' buttons below, framed in forest green. One committed look, so no dark-mode switch. */
:root {
  --forest: #1f3a2e;     /* the frame: the forest at dusk */
  --forest-2: #2b4c3c;
  --page: #f8f1e1;       /* the book's cream page, as in the preview */
  --ink: #2c2420;
  --muted: #6d5f52;
  --gold: #d9a441;       /* forest magic */
  --elin: #e4735a;       /* character colours from the series bible */
  --alva: #3f8697;
  --paul: #b8862f;
  --clarissa: #b5523b;
  --sukhi: #c9822f;
  --display: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --story: "Andika", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--forest) radial-gradient(120% 80% at 50% 0%, var(--forest-2), var(--forest) 70%);
  color: var(--ink); font-family: var(--story);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 20px;
  -webkit-tap-highlight-color: transparent;
}
.book { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--page); }
header h1 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.4vw, 30px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.treasures { display: flex; gap: 6px; }
.treasures span { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.07); border: 1.5px dashed rgba(248,241,225,.35); }
.treasures span.got { background: rgba(217,164,65,.22); border: 1.5px solid var(--gold); }
.treasures svg { width: 26px; height: 26px; opacity: .3; }
.treasures span.got svg { opacity: 1; }
.chip-btn { font: 600 15px var(--story); color: var(--page); background: rgba(255,255,255,.08); border: 1.5px solid rgba(248,241,225,.4); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--gold); }
.chip-btn:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.stage-wrap { position: relative; width: min(100%, calc(58vh * 5 / 3)); margin-inline: auto; border-radius: 14px; overflow: hidden; background: var(--forest-2); box-shadow: 0 10px 30px rgba(0,0,0,.35); border: 3px solid #13261d; }
#stage { display: block; width: 100%; height: auto; aspect-ratio: 5 / 3; }
.page { background: var(--page); border-radius: 14px; padding: 18px clamp(16px, 3vw, 28px) 18px; box-shadow: 0 10px 30px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 14px; min-height: 170px; }
.who { font: 700 15px var(--story); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
.who i { width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--muted)); display: inline-block; }
#text { font-size: clamp(19px, 2.5vw, 24px); line-height: 1.5; margin: 0; max-width: 46em; text-wrap: pretty; }
#text.verse { font-family: "IM Fell English", Georgia, serif; font-style: italic; font-size: clamp(21px, 2.8vw, 27px); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.actions.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.side { border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--c) 10%, var(--page)); border: 2px solid color-mix(in srgb, var(--c) 45%, var(--page)); }
.side h3 { margin: 0; font: 700 15px var(--story); letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.side .row { display: flex; gap: 8px; flex-wrap: wrap; }
button.act { font: 700 clamp(17px, 2.2vw, 20px) var(--story); color: var(--ink); background: #fffaf0; border: 2.5px solid #d9c9a8; border-radius: 12px; padding: 12px 18px; min-height: 54px; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; touch-action: manipulation; transition: transform .08s, background .15s; }
button.act:hover { border-color: var(--gold); }
button.act:active { transform: scale(.97); }
button.act.primary { background: var(--forest); color: var(--page); border-color: var(--forest); }
button.act.elin { border-color: var(--elin); }
button.act.alva { border-color: var(--alva); }
button.act.chosen { background: var(--gold); border-color: var(--gold); }
button.act.wrong { animation: shake .35s; }
button.act svg { width: 34px; height: 34px; flex: none; }
button.act.big { flex: 1 1 160px; justify-content: center; }
.meter { height: 14px; border-radius: 7px; background: #e9dcc0; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5a8fc7, #8fd0ff); transition: width .25s; }
.hint { font-size: 16px; color: var(--muted); margin: 0; }
.tap { cursor: pointer; }
.tap.pulse { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 0%,100% { filter: drop-shadow(0 0 0 rgba(255,215,120,0)); } 50% { filter: drop-shadow(0 0 14px rgba(255,215,120,.95)); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.float { animation: bob 3s ease-in-out infinite; transform-box: fill-box; }
.twinkle { animation: twinkle 2.2s ease-in-out infinite; }
@media (max-width: 560px) { .actions.split { grid-template-columns: 1fr; } button.act { padding: 10px 14px; } }
@media (prefers-reduced-motion: reduce) { .float, .twinkle, .tap.pulse { animation: none; } }
</style>

<div class="book">
  <header>
    <h1>The Swords of Pembury</h1>
    <div class="tools">
      <div class="treasures" aria-label="Treasures found">
        <span id="t-hat" title="The Hat"></span><span id="t-socks" title="The Socks"></span><span id="t-shield" title="The Shield"></span><span id="t-swords" title="The Swords"></span>
      </div>
      <button class="chip-btn" id="voice" aria-pressed="true" type="button">Read aloud</button>
    </div>
  </header>
  <div class="stage-wrap"><svg id="stage" viewBox="0 0 1000 600" role="img" aria-label="Story picture"></svg></div>
  <section class="page" aria-live="polite">
    <div class="who" id="who"></div>
    <p id="text"></p>
    <div class="actions" id="actions"></div>
  </section>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const rnd = (n) => Math.floor(Math.random() * n);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ------------------------------------------------------------------ the cast (colours from the series bible)
const C = {
  elinTop: "#e4735a", alvaTop: "#3f8697", clarissaTop: "#b5523b", tweed: "#8c7a55", cords: "#a97f4b",
  skinTwin: "#f0cba6", skinMum: "#efc9a2", skinDad: "#f6d9c0", hairDark: "#2a1f1c", hairBrown: "#6b4a2f",
  sukhi: "#d9944a", spots: "#6b3f1f", eyes: "#4fae63", ink: "#2c2420",
};
const SPEAKERS = {
  Elin: { c: "#e4735a", pitch: 1.3, rate: 1.0 }, Alva: { c: "#3f8697", pitch: 1.22, rate: 0.97 },
  Daddy: { c: "#b8862f", pitch: 0.85, rate: 0.95 }, Mummy: { c: "#b5523b", pitch: 1.08, rate: 0.95 },
  "The Witch": { c: "#5b4778", pitch: 0.7, rate: 0.85 }, "The Squirrel": { c: "#7a1f2b", pitch: 0.4, rate: 0.85 },
  "The Guardian": { c: "#5d7a3a", pitch: 0.5, rate: 0.8 }, "The Forest": { c: "#d9a441", pitch: 0.6, rate: 0.8 },
  "": { c: "#6d5f52", pitch: 1, rate: 0.95 },
};

function face(cy, s = 1) {
  return `<circle cx="${-8 * s}" cy="${cy + 2 * s}" r="${2.7 * s}" fill="${C.ink}"/><circle cx="${8 * s}" cy="${cy + 2 * s}" r="${2.7 * s}" fill="${C.ink}"/>
  <path d="M${-6 * s} ${cy + 11 * s} Q0 ${cy + 16 * s} ${6 * s} ${cy + 11 * s}" stroke="${C.ink}" stroke-width="${2 * s}" fill="none" stroke-linecap="round"/>
  <circle cx="${-14 * s}" cy="${cy + 9 * s}" r="${4.5 * s}" fill="#e98b7a" opacity=".35"/><circle cx="${14 * s}" cy="${cy + 9 * s}" r="${4.5 * s}" fill="#e98b7a" opacity=".35"/>`;
}
// a girl, feet at the origin, about 160 tall
function girl(id, x, y, who, opts = {}) {
  const top = who === "elin" ? C.elinTop : C.alvaTop, s = opts.s || 1, flip = opts.flip ? -1 : 1;
  const hair = who === "elin"
    ? `<path d="M-25 -122 C-29 -158 29 -158 25 -122 Q16 -136 0 -138 Q-16 -136 -25 -122Z" fill="${C.hairDark}"/><circle cx="0" cy="-158" r="12" fill="${C.hairDark}"/>`
    : `<path d="M-27 -106 C-32 -160 32 -160 27 -106 L19 -106 L19 -133 Q0 -139 -19 -133 L-19 -106Z" fill="${C.hairDark}"/>`;
  const hat = opts.hat ? hatShape(0, -146, 0.85) : "";
  const sock = opts.socks ? `<rect x="-14" y="-22" width="10" height="20" fill="url(#rainbow)"/><rect x="4" y="-22" width="10" height="20" fill="url(#rainbow)"/>` : "";
  return `<g id="${id}" transform="translate(${x} ${y}) scale(${s * flip} ${s})">
    <ellipse cx="0" cy="2" rx="34" ry="7" fill="#000" opacity=".18"/>
    <rect x="-14" y="-40" width="10" height="40" rx="4" fill="#3b3330"/><rect x="4" y="-40" width="10" height="40" rx="4" fill="#3b3330"/>${sock}
    <ellipse cx="-10" cy="-2" rx="9" ry="5" fill="#4a2e22"/><ellipse cx="10" cy="-2" rx="9" ry="5" fill="#4a2e22"/>
    <path d="M-19 -100 L19 -100 L30 -36 L-30 -36Z" fill="${top}" stroke="${top}" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-20 -94 L-32 -60" stroke="${top}" stroke-width="11" stroke-linecap="round"/><path d="M20 -94 L32 -60" stroke="${top}" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-33" cy="-56" r="6" fill="${C.skinTwin}"/><circle cx="33" cy="-56" r="6" fill="${C.skinTwin}"/>
    <rect x="-6" y="-106" width="12" height="10" fill="${C.skinTwin}"/>
    <circle cx="0" cy="-124" r="24" fill="${C.skinTwin}"/>${face(-126)}${hair}${hat}
  </g>`;
}
function adult(id, x, y, who, opts = {}) {
  const s = (opts.s || 1) * 1.28, isDad = who === "paul";
  const skin = isDad ? C.skinDad : C.skinMum;
  const body = isDad
    ? `<rect x="-17" y="-48" width="13" height="48" rx="5" fill="${C.cords}"/><rect x="4" y="-48" width="13" height="48" rx="5" fill="${C.cords}"/>
       <path d="M-22 -102 L22 -102 L25 -44 L-25 -44Z" fill="${C.tweed}" stroke="${C.tweed}" stroke-width="8" stroke-linejoin="round"/>
       <path d="M0 -102 L0 -46" stroke="#6f603f" stroke-width="2"/><path d="M-8 -102 L0 -86 L8 -102" fill="#f2ead8"/>`
    : `<rect x="-13" y="-30" width="10" height="30" rx="4" fill="#3b3330"/><rect x="3" y="-30" width="10" height="30" rx="4" fill="#3b3330"/>
       <path d="M-20 -102 L20 -102 L32 -28 L-32 -28Z" fill="${C.clarissaTop}" stroke="${C.clarissaTop}" stroke-width="8" stroke-linejoin="round"/>`;
  const sleeve = isDad ? C.tweed : C.clarissaTop;
  const hair = isDad
    ? `<path d="M-25 -120 C-27 -158 27 -158 25 -120 Q14 -138 -4 -135 Q-16 -133 -25 -120Z" fill="${C.hairBrown}"/>`
    : `<path d="M-25 -122 C-29 -158 29 -158 25 -122 Q18 -138 0 -140 Q-18 -138 -25 -122Z" fill="${C.hairDark}"/><circle cx="14" cy="-152" r="11" fill="${C.hairDark}"/><path d="M6 -160 L24 -144" stroke="#d9a441" stroke-width="2.5"/>`;
  const cloak = opts.cloak ? `<path d="M-26 -100 L-38 -10 L-24 -18 L-14 -6 L0 -16 L14 -6 L24 -18 L38 -10 L26 -100Z" fill="#4b4060" opacity=".92"/>` : "";
  const flowerHat = opts.flowers ? `<ellipse cx="0" cy="-142" rx="40" ry="9" fill="#d8c290"/><path d="M-22 -142 Q-20 -168 0 -168 Q20 -168 22 -142Z" fill="#d8c290"/><circle cx="-12" cy="-148" r="5" fill="#e4735a"/><circle cx="-2" cy="-150" r="5" fill="#f2d16b"/><circle cx="8" cy="-148" r="5" fill="#9c6bd1"/>` : "";
  return `<g id="${id}" transform="translate(${x} ${y}) scale(${s} ${s})">
    <ellipse cx="0" cy="2" rx="34" ry="7" fill="#000" opacity=".18"/>${cloak}${body}
    <ellipse cx="-10" cy="-2" rx="10" ry="5" fill="#3a251c"/><ellipse cx="10" cy="-2" rx="10" ry="5" fill="#3a251c"/>
    <path d="M-22 -96 L-30 -54" stroke="${sleeve}" stroke-width="12" stroke-linecap="round"/><path d="M22 -96 L30 -54" stroke="${sleeve}" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-31" cy="-50" r="6" fill="${skin}"/><circle cx="31" cy="-50" r="6" fill="${skin}"/>
    <rect x="-6" y="-108" width="12" height="10" fill="${skin}"/><circle cx="0" cy="-124" r="24" fill="${skin}"/>${face(-126)}${hair}${flowerHat}
  </g>`;
}
function cat(id, x, y, pose = "sit", s = 1) {
  if (pose === "walk") return `<g id="${id}" transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="2" rx="34" ry="5" fill="#000" opacity=".18"/>
    <path d="M-28 -30 C-40 -50 -38 -78 -32 -88" stroke="${C.sukhi}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-20 -24 L-22 0 M-8 -22 L-8 0 M14 -22 L14 0 M24 -24 L26 0" stroke="${C.sukhi}" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="32" ry="14" fill="${C.sukhi}"/>
    <ellipse cx="-12" cy="-34" rx="5" ry="3" fill="${C.spots}"/><ellipse cx="4" cy="-28" rx="5" ry="3" fill="${C.spots}"/><ellipse cx="16" cy="-36" rx="4" ry="3" fill="${C.spots}"/>
    <circle cx="34" cy="-42" r="14" fill="${C.sukhi}"/><path d="M24 -52 L26 -66 L34 -55Z M36 -55 L44 -66 L45 -51Z" fill="${C.sukhi}"/>
    <circle cx="31" cy="-44" r="2.6" fill="${C.eyes}"/><circle cx="40" cy="-44" r="2.6" fill="${C.eyes}"/><path d="M34 -38 l2 2 l2 -2" stroke="${C.ink}" stroke-width="1.5" fill="none"/>
  </g>`;
  return `<g id="${id}" transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="0" cy="2" rx="28" ry="5" fill="#000" opacity=".18"/>
    <path d="M14 -6 C40 -4 42 -30 30 -36" stroke="${C.sukhi}" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-20" rx="20" ry="22" fill="${C.sukhi}"/>
    <ellipse cx="-8" cy="-22" rx="4.5" ry="3" fill="${C.spots}"/><ellipse cx="7" cy="-14" rx="4.5" ry="3" fill="${C.spots}"/><ellipse cx="-4" cy="-8" rx="4" ry="2.6" fill="${C.spots}"/>
    <circle cx="0" cy="-46" r="15" fill="${C.sukhi}"/><path d="M-12 -54 L-11 -70 L-2 -59Z M2 -59 L11 -70 L12 -54Z" fill="${C.sukhi}"/>
    <circle cx="-6" cy="-47" r="2.8" fill="${C.eyes}"/><circle cx="6" cy="-47" r="2.8" fill="${C.eyes}"/><path d="M-2 -40 l2 2 l2 -2" stroke="${C.ink}" stroke-width="1.5" fill="none"/>
  </g>`;
}
const DEFS = `<defs>
  <linearGradient id="rainbow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4735a"/><stop offset=".2" stop-color="#e4735a"/><stop offset=".2" stop-color="#f2c14e"/><stop offset=".4" stop-color="#f2c14e"/><stop offset=".4" stop-color="#7fb35a"/><stop offset=".6" stop-color="#7fb35a"/><stop offset=".6" stop-color="#4f8fc7"/><stop offset=".8" stop-color="#4f8fc7"/><stop offset=".8" stop-color="#9c6bd1"/><stop offset="1" stop-color="#9c6bd1"/></linearGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#bfe6ff" stop-opacity=".9"/><stop offset="1" stop-color="#5aa0e0" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowG"><stop offset="0" stop-color="#ffe7a0" stop-opacity=".95"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowM"><stop offset="0" stop-color="#cfffc0" stop-opacity=".7"/><stop offset="1" stop-color="#7fcf8a" stop-opacity="0"/></radialGradient>
  <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3b8"/><stop offset="1" stop-color="#cfe2cf"/></linearGradient>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3b52"/><stop offset="1" stop-color="#4c6a5a"/></linearGradient>
  <linearGradient id="golden" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d58c"/><stop offset="1" stop-color="#e9a95c"/></linearGradient>
</defs>`;

// ------------------------------------------------------------------ the treasures and the map's symbols
function hatShape(x, y, s = 1) {
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="0" rx="44" ry="10" fill="#1d1a2b"/><path d="M-24 0 Q-22 -44 0 -60 Q8 -40 26 -2Z" fill="#1d1a2b"/>
  <g fill="#f6d97a"><circle cx="-8" cy="-20" r="2.4"/><circle cx="6" cy="-34" r="2"/><circle cx="10" cy="-12" r="2.4"/><circle cx="-30" cy="-2" r="1.8"/><circle cx="30" cy="0" r="1.8"/><circle cx="-2" cy="-46" r="1.6"/></g></g>`;
}
function socksShape(x, y, s = 1) {
  const one = (dx, r) => `<g transform="translate(${dx} 0) rotate(${r})"><path d="M-9 -40 L9 -40 L9 -6 Q9 4 22 4 Q30 4 30 12 Q30 20 18 20 L-2 20 Q-9 20 -9 12Z" fill="url(#rainbow)" stroke="#fff6" stroke-width="1"/></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">${one(-16, -6)}${one(10, 6)}</g>`;
}
function shieldShape(x, y, s = 1, glow = true) {
  return `<g transform="translate(${x} ${y}) scale(${s})">${glow ? `<circle r="70" fill="url(#glowB)"/>` : ""}<circle r="40" fill="#5a8fc7" stroke="#d7ecff" stroke-width="5"/>
  <path d="M0 0 m0 -4 a4 4 0 1 1 -4 4 a8 8 0 1 1 8 -8 a14 14 0 1 1 -14 14 a20 20 0 1 1 20 -20" fill="none" stroke="#e8f5ff" stroke-width="3" stroke-linecap="round"/></g>`;
}
function swordsShape(x, y, s = 1) {
  const blade = (r) => `<g transform="rotate(${r})"><path d="M-4 -70 L0 -82 L4 -70 L4 10 L-4 10Z" fill="#dfe6ee" stroke="#9fb0c0" stroke-width="1.5"/><rect x="-16" y="10" width="32" height="6" rx="2" fill="#c99a3b"/><rect x="-3.5" y="16" width="7" height="22" rx="2" fill="#6b4a2f"/><circle cy="42" r="5" fill="#c99a3b"/></g>`;
  return `<g transform="translate(${x} ${y}) scale(${s})">${blade(-28)}${blade(28)}</g>`;
}
function sym(name, x, y, s = 1, col = "#f6e6b4") {
  const g = (d) => `<g transform="translate(${x} ${y}) scale(${s})">${d}</g>`;
  switch (name) {
    case "star": return g(`<path d="M0 -22 L6 -7 L22 -7 L9 3 L14 19 L0 9 L-14 19 L-9 3 L-22 -7 L-6 -7Z" fill="${col}"/>`);
    case "moon": return g(`<path d="M6 -20 A20 20 0 1 0 6 20 A24 24 0 0 1 6 -20Z" fill="${col}"/>`);
    case "sun": return g(`<circle r="10" fill="${col}"/>${[0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<path d="M0 -14 L0 -21" transform="rotate(${a})" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`).join("")}`);
    case "spiral": return g(`<path d="M0 0 m0 -3 a3 3 0 1 1 -3 3 a7 7 0 1 1 7 -7 a12 12 0 1 1 -12 12 a17 17 0 1 1 17 -17" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`);
    case "fish": return g(`<path d="M-18 -8 Q-6 -20 6 -10 L14 -16 L12 -6 Q4 2 -18 -8Z" fill="${col}"/><path d="M18 8 Q6 20 -6 10 L-14 16 L-12 6 Q-4 -2 18 8Z" fill="${col}"/>`);
    case "leaf": return g(`<path d="M-16 14 Q-16 -16 16 -16 Q16 14 -16 14Z" fill="${col}"/><path d="M-14 12 L12 -12" stroke="#0004" stroke-width="2"/>`);
    case "wave": return g(`<path d="M-20 0 Q-15 -10 -10 0 T0 0 T10 0 T20 0" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/><path d="M-20 10 Q-15 0 -10 10 T0 10 T10 10 T20 10" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/>`);
    case "circle": return g(`<circle r="18" fill="none" stroke="${col}" stroke-width="5"/>`);

// both twins must press their own button (multi-touch, two clicks, or the E and A keys)
function together(text, labelE, labelA, quick = false) {
  setText("", text);
  const a = clearActions(); a.className = "actions split";
  a.innerHTML = `<div class="side" style="--c:var(--elin)"><h3>Elin</h3><div class="row" id="eRow"></div></div><div class="side" style="--c:var(--alva)"><h3>Alva</h3><div class="row" id="aRow"></div></div>`;
  const e = button(labelE, "big elin"), al = button(labelA, "big alva");
  $("eRow").append(e); $("aRow").append(al);
  return new Promise((res) => {
    let te = 0, ta = 0;
    const check = () => {
      if (te && ta && Math.abs(te - ta) < (quick ? 1500 : 4000)) { chime(); document.removeEventListener("keydown", keys); res(); }
      else if (te && ta) { bonk(); te = ta = 0; e.classList.remove("chosen"); al.classList.remove("chosen"); setText("", "Not quite together! Try again, at the same moment."); }
    };
    const hit = (who) => {
      if (who === "e") { te = performance.now(); e.classList.add("chosen"); } else { ta = performance.now(); al.classList.add("chosen"); }
      setTimeout(check, 30);
      setTimeout(() => { const now = performance.now(); if (who === "e" && !ta && now - te > (quick ? 1500 : 4000)) { te = 0; e.classList.remove("chosen"); } if (who === "a" && !te && now - ta > (quick ? 1500 : 4000)) { ta = 0; al.classList.remove("chosen"); } }, quick ? 1600 : 4100);
    };
    e.onpointerdown = (ev) => { ev.preventDefault(); hit("e"); };
    al.onpointerdown = (ev) => { ev.preventDefault(); hit("a"); };
    e.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") hit("e"); };
    al.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") hit("a"); };
    const keys = (ev) => { if (ev.key === "e" || ev.key === "E") hit("e"); if (ev.key === "a" || ev.key === "A") hit("a"); };
    document.addEventListener("keydown", keys);
  });
}
// each twin picks on her own side; they must agree, and be right
function bothChoose(text, pair, right, eachAlone = false) {
  setText("", text);
  const a = clearActions(); a.className = "actions split";
  a.innerHTML = `<div class="side" style="--c:var(--elin)"><h3>Elin</h3><div class="row" id="eRow"></div></div><div class="side" style="--c:var(--alva)"><h3>Alva</h3><div class="row" id="aRow"></div></div>`;
  return new Promise((res) => {
    const pick = { e: null, a: null }, btns = { e: [], a: [] };
    for (const who of ["e", "a"]) for (const s of pair) {
      const b = button("", "big " + (who === "e" ? "elin" : "alva"), icon(s));
      b.setAttribute("aria-label", s); if (s === right) b.dataset.ok = "1";
      b.onclick = () => {
        pick[who] = s; btns[who].forEach((x) => x.classList.toggle("chosen", x === b));
        if (eachAlone && s !== right) { bonk(); b.classList.add("wrong"); pick[who] = null; setTimeout(() => b.classList.remove("chosen", "wrong"), 400); return; }
        if (pick.e && pick.a) {
          if (pick.e === pick.a && pick.e === right) { chime(); setTimeout(res, 500); }
          else {
            bonk();
            setText("The Forest", pick.e !== pick.a ? "The two paths flicker and fade. You chose different ways! Choose together." : "The path dims under your feet. That isn't the way. Try again, together.");
            setTimeout(() => { pick.e = pick.a = null; btns.e.concat(btns.a).forEach((x) => x.classList.remove("chosen")); }, 900);
          }
        }
      };
      btns[who].push(b); $(who === "e" ? "eRow" : "aRow").append(b);
    }
  });
}
